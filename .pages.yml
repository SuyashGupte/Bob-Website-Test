media:
  input: assets/images
  output: /assets/images

content:
  - name: modes
    label: "🤖 Bob Modes"
    type: collection
    path: _modes
    fields:
      - name: layout
        type: string
        default: "default"
      - name: title
        label: "Mode Name"
        type: string
      - name: version
        label: "Version Tag (e.g., v1.2)"
        type: string
      - name: body
        label: "Mode Description / Key Features"
        type: rich-text

# Made with Bob
